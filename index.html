<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>Sam · luyện IELTS</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
  :root { --main:#1d4ed8; --bg:#f4f6fb; --ai:#fff; --me:#dbe7ff; --fix:#fff4e0; --ink:#1a1f2b; --mute:#6b7280; --ok:#15803d; --line:#e5e7eb; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink);
         height:100dvh; display:flex; flex-direction:column; }
  header { background:var(--main); color:#fff; padding:10px 14px; display:flex; align-items:center; gap:8px; }
  header h1 { font-size:17px; margin:0; flex:1; }
  header h1 small { display:block; font-size:12px; font-weight:400; opacity:.85; }
  #level { background:#fff; color:var(--main); border:0; border-radius:99px; padding:3px 11px; font-weight:700; font-size:13px; }
  #openSet { background:none; border:0; color:#fff; font-size:20px; padding:4px; }
  nav { display:flex; background:#fff; border-bottom:1px solid var(--line); }
  nav button { flex:1; border:0; background:none; padding:9px; font-size:15px; font-weight:600; color:var(--mute); border-bottom:3px solid transparent; }
  nav button.on { color:var(--main); border-bottom-color:var(--main); }
  .view { flex:1; display:flex; flex-direction:column; min-height:0; }
  .view[hidden] { display:none; }
  #chat { flex:1; overflow-y:auto; padding:10px 12px 16px; }
  .msg { max-width:86%; margin:6px 0; padding:9px 12px; border-radius:16px; white-space:pre-wrap; word-wrap:break-word; }
  .ai { background:var(--ai); box-shadow:0 1px 2px #0001; border-bottom-left-radius:4px; }
  .me { background:var(--me); margin-left:auto; border-bottom-right-radius:4px; }
  .cmd { margin:10px auto; text-align:center; color:var(--mute); font-size:13px; }
  .say { color:var(--main); font-weight:600; }
  .fix { display:block; background:var(--fix); border-radius:8px; padding:4px 8px; margin:4px 0 0; font-size:14.5px; }
  .ai .play { border:0; background:none; font-size:17px; padding:0 0 0 4px; }
  #modebar { display:flex; align-items:center; gap:8px; background:#eef3ff; color:var(--main); padding:6px 12px; font-size:13.5px; font-weight:600; border-top:1px solid var(--line); }
  #modebar[hidden] { display:none; }
  #modebar span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #modebar button { border:1px solid var(--main); background:#fff; color:var(--main); border-radius:8px; padding:3px 10px; font-weight:600; white-space:nowrap; }
  footer { display:flex; gap:6px; padding:8px 10px calc(8px + env(safe-area-inset-bottom)); background:#fff; border-top:1px solid var(--line); }
  #text { flex:1; border:1px solid #d1d5db; border-radius:12px; padding:10px; font:inherit; resize:none; height:46px; }
  #text:focus, #text.long { height:110px; }
  footer button { border:0; border-radius:12px; min-width:48px; font-size:20px; background:var(--main); color:#fff; }
  #mic.on { background:#dc2626; }
  #road { overflow-y:auto; padding:12px 12px 24px; }
  .card { background:#fff; border-radius:14px; padding:12px 14px; margin-bottom:12px; box-shadow:0 1px 2px #0001; }
  .card h2 { font-size:16px; margin:0 0 6px; }
  .stats { display:flex; gap:8px; text-align:center; }
  .stats div { flex:1; background:var(--bg); border-radius:10px; padding:8px 4px; }
  .stats b { display:block; font-size:22px; color:var(--main); }
  .stats span { font-size:12px; color:var(--mute); }
  .acts { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; margin-top:10px; }
  .acts button { border:1px solid var(--main); background:#fff; color:var(--main); border-radius:10px; padding:8px 4px; font-size:14px; font-weight:600; }
  .acts button.pri { background:var(--main); color:#fff; }
  .chips span { display:inline-block; background:var(--fix); border-radius:99px; padding:2px 10px; margin:3px 4px 0 0; font-size:13px; }
  .bar { height:8px; background:var(--bg); border-radius:99px; overflow:hidden; margin:4px 0 8px; }
  .bar i { display:block; height:100%; background:var(--main); }
  .unit { display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line); }
  .unit .t { flex:1; min-width:0; }
  .unit .t b { display:block; font-size:15px; }
  .unit .t small { color:var(--mute); font-size:12.5px; }
  .unit .s { font-weight:700; color:var(--ok); white-space:nowrap; }
  .unit button { border:1px solid var(--main); background:#fff; color:var(--main); border-radius:8px; padding:5px 10px; font-weight:600; }
  .unit.next button { background:var(--main); color:#fff; }
  .hint { color:var(--mute); font-size:13px; }
  .hist { font-size:13.5px; margin:4px 0; }
  dialog { border:0; border-radius:14px; width:min(420px,92vw); }
  dialog h3 { margin:0 0 8px; }
  dialog label { display:block; margin:10px 0 4px; font-weight:600; font-size:14px; }
  dialog input { width:100%; padding:9px; border:1px solid #d1d5db; border-radius:8px; font:inherit; }
  .row { display:flex; gap:8px; margin-top:14px; }
  .row button { flex:1; padding:10px; border-radius:10px; border:1px solid var(--main); background:#fff; color:var(--main); font-weight:600; }
  .row button.pri { background:var(--main); color:#fff; }
</style>
</head>
<body>
<header>
  <h1>Sam<small>người bản xứ luyện IELTS cùng bạn</small></h1>
  <button id="level" aria-label="Xem band">chưa rõ</button>
  <button id="openSet" aria-label="Cài đặt">⚙️</button>
</header>
<nav>
  <button data-view="vChat" class="on">💬 Nói chuyện</button>
  <button data-view="vRoad">🎯 IELTS</button>
</nav>

<section id="vChat" class="view">
  <main id="chat"></main>
  <div id="modebar" hidden><span id="modeText"></span><button id="stop">Dừng</button></div>
  <footer>
    <button id="mic" aria-label="Nói">🎤</button>
    <textarea id="text" placeholder="Nhắn cho Sam…"></textarea>
    <button id="send" aria-label="Gửi">➤</button>
  </footer>
</section>

<section id="vRoad" class="view" hidden>
  <div id="road"></div>
</section>

<dialog id="set">
  <h3>Cài đặt</h3>
  <label for="key">Khoá Gemini API (miễn phí)</label>
  <input id="key" type="password" autocomplete="off" placeholder="Dán khoá vào đây">
  <p class="hint">Lấy khoá free tại <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a>. Khoá chỉ lưu trên máy này.</p>
  <label for="model">Model</label>
  <input id="model">
  <div class="row">
    <button id="reset">Xoá hết dữ liệu</button>
    <button id="save" class="pri">Lưu</button>
  </div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

// LỘ TRÌNH IELTS: 4 chặng theo band mục tiêu, nặng Speaking (nói như người bản xứ) + Writing.
const STAGES = {
  '5': 'Lên band 5.5: trả lời Part 1 trôi chảy, nói đủ 2 phút Part 2, viết đúng cấu trúc.',
  '6': 'Lên band 6.5: mở rộng ý, câu phức, collocation theo chủ đề, Writing Task 1/2 đủ ý.',
  '7': 'Lên band 7.5: nói tự nhiên như người bản xứ, từ vựng ít phổ biến, Part 3 trừu tượng.',
  '8': 'Band 8+: chính xác gần tuyệt đối, idiom đúng chỗ, lập luận sắc, ngữ điệu biểu cảm.',
};
const UNITS = [
  ['B5-01', 'Part 1: bản thân, quê quán, công việc', 'trả lời 2–3 câu theo công thức Ý chính + Lý do + Ví dụ'],
  ['B5-02', 'Part 1: sở thích & thói quen', 'hiện tại đơn/tiếp diễn chuẩn, tránh trả lời cụt'],
  ['B5-03', 'Part 1: kỷ niệm & quá khứ', 'quá khứ đơn, phát âm đuôi -ed'],
  ['B5-04', 'Phát âm nền tảng', 'âm cuối, đuôi -s/-ed, trọng âm từ – lỗi người Việt hay mắc'],
  ['B5-05', 'Part 2 nhập môn', 'đọc cue card, ghi chú 1 phút, nói đủ 1–2 phút'],
  ['B5-06', 'Part 2: tả một người', 'tính từ miêu tả tính cách, ngoại hình'],
  ['B5-07', 'Part 2: tả một nơi chốn', 'so sánh, there is/are, giới từ nơi chốn'],
  ['B5-08', 'Writing Task 1 nhập môn', 'paraphrase đề, câu overview, chọn số liệu chính'],
  ['B5-09', 'Writing Task 2 nhập môn', 'phân tích đề, bố cục 4 đoạn, câu chủ đề'],
  ['B5-10', 'Từ nối & mạch lạc', 'firstly, however, as a result… dùng đúng, không lạm dụng'],
  ['B6-01', 'Part 1 tự nhiên như người bản xứ', 'filler tự nhiên (well, to be honest…), câu trả lời có cá tính'],
  ['B6-02', 'Part 2: kể một sự kiện/trải nghiệm', 'quá khứ tiếp diễn, trình tự kể chuyện'],
  ['B6-03', 'Part 2: tả đồ vật & công nghệ', 'mệnh đề quan hệ, tính từ ghép'],
  ['B6-04', 'Part 3 nhập môn', 'nêu ý kiến → giải thích → ví dụ → kết'],
  ['B6-05', 'Part 3: quá khứ, hiện tại, tương lai', 'so sánh thời kỳ, dự đoán với will/might/be likely to'],
  ['B6-06', 'Collocation theo chủ đề', 'work, education, environment, technology, health'],
  ['B6-07', 'Grammatical Range', 'câu điều kiện, bị động, mệnh đề quan hệ trong câu nói'],
  ['B6-08', 'Writing Task 1: line & bar chart', 'ngôn ngữ xu hướng, so sánh số liệu'],
  ['B6-09', 'Writing Task 2: opinion essay', 'lập trường rõ, lập luận + ví dụ'],
  ['B6-10', 'Ngữ điệu & nhấn câu', 'nhấn từ quan trọng, nối âm, ngắt nhịp tự nhiên'],
  ['B7-01', 'Nói như người bản xứ', 'phrasal verbs & idiom thông dụng, dùng đúng ngữ cảnh'],
  ['B7-02', 'Part 2: 2 phút không ngắt', 'kỹ thuật kéo dài ý, không lặp từ'],
  ['B7-03', 'Part 3 trừu tượng', 'xã hội, chính sách, nguyên nhân – hệ quả'],
  ['B7-04', 'Nói mềm & thận trọng', 'hedging: it seems, to some extent, I\'d argue…'],
  ['B7-05', 'Lexical Resource', 'paraphrase, từ ít phổ biến, tránh lặp từ của đề'],
  ['B7-06', 'Ngữ pháp nâng cao', 'mệnh đề rút gọn, đảo ngữ nhẹ, điều kiện hỗn hợp'],
  ['B7-07', 'Writing Task 1: process & map', 'bị động, ngôn ngữ vị trí & thay đổi'],
  ['B7-08', 'Writing Task 2: các dạng đề', 'discussion, problem–solution, advantages–disadvantages'],
  ['B7-09', 'Connected speech', 'weak forms, nối âm, nhịp tiếng Anh như người bản xứ'],
  ['B7-10', 'Thi thử & tự sửa', 'làm trọn Speaking, nghe lại, sửa lỗi của chính mình'],
  ['B8-01', 'Idiom tự nhiên, không học thuộc', 'chọn idiom hợp ngữ cảnh, tránh nghe gượng'],
  ['B8-02', 'Part 3: tranh luận sâu', 'phản biện, nhượng bộ, cân nhắc nhiều phía'],
  ['B8-03', 'Độ chính xác gần tuyệt đối', 'mạo từ, giới từ, số ít/nhiều – lỗi nhỏ người Việt còn sót'],
  ['B8-04', 'Từ vựng sắc thái', 'synonym, register trang trọng vs thân mật'],
  ['B8-05', 'Writing Task 2 band 8', 'lập luận tinh tế, câu chủ đề sắc, kết luận mạnh'],
  ['B8-06', 'Writing Task 1 band 8', 'chọn điểm nổi bật, so sánh chính xác'],
  ['B8-07', 'Phát âm biểu cảm', 'ngữ điệu thể hiện thái độ, rõ ràng như người bản xứ'],
  ['B8-08', 'Ứng biến chủ đề lạ', 'giữ trôi chảy khi gặp câu hỏi khó'],
  ['B8-09', 'Phá trần band của người Việt', 'những lỗi giữ chân ở band 6.5–7'],
  ['B8-10', 'Tổng duyệt', 'thi thử Speaking + Writing, đánh giá toàn diện'],
].map(([id, t, d]) => ({ id, t, d, st: id[1] }));
const unitById = id => UNITS.find(u => u.id === id);
const TOPICS = 'hometown, work or studies, home, hobbies, sport, music, films, reading, food and cooking, travel, weather, shopping, technology and phones, social media, friends and family, childhood, celebrations, transport, environment, health, education, success, money, art, the future';

// Band IELTS: 0–9, bước 0.5.
const toBand = x => { const n = Math.round(parseFloat(x) * 2) / 2; return n >= 1 && n <= 9 ? n : NaN; };
const fmt = n => isNaN(n) ? '' : n.toFixed(1);

// Mặc định Flash-Lite: đo 07/10/2026 trả lời 1-2s, bản Flash thường mất 20-76s vì quá tải.
const DEFAULT_MODEL = 'gemini-flash-lite-latest';
let key = load('gs_key', '');
let model = load('gs_model', DEFAULT_MODEL);
if (model === 'gemini-flash-latest') { model = DEFAULT_MODEL; store('gs_model', model); }
let profile = load('ie_profile', { band: '', weak: [], note: '' }); // band = ước tính band Speaking
let scores = load('ie_scores', {});  // { 'B6-04': {score: 8, date} }
let tests = load('ie_tests', []);    // thi thử: [{date, kind, overall, crit:{...}}]
let hist = load('ie_hist', []);      // {role:'user'|'model', text}
let mode = load('ie_mode', '');      // '' = nói chuyện; SPEAKING / WRITING / LESSON / REVIEW
let unit = load('ie_unit', '');
const MAX_HIST = 40; // ponytail: chỉ gửi 40 lượt gần nhất; band & điểm yếu dài hạn nằm trong profile
const today = () => new Date().toLocaleDateString('sv');
const CRIT = { Speaking: ['FC', 'LR', 'GRA', 'P'], Writing: ['TA', 'CC', 'LR', 'GRA'] };

function stageOf(b) { b = toBand(b); return isNaN(b) || b < 5.5 ? '5' : b < 6.5 ? '6' : b < 7.5 ? '7' : '8'; }
function nextUnit() {
  const start = UNITS.findIndex(u => u.st === stageOf(profile.band));
  return UNITS.slice(start).find(u => !scores[u.id]) || UNITS.find(u => !scores[u.id]) || UNITS[UNITS.length - 1];
}

function systemPrompt() {
  const u = unitById(unit);
  const b = profile.band || 'unknown yet';
  return `You are Sam, a native English speaker and an experienced IELTS coach (you know the official band descriptors inside out), chatting with a Vietnamese adult friend who wants a high IELTS band and to sound like a native speaker. Mostly you just chat like a real native friend over text and share a bit about yourself too. When they send a bracketed command, you run that IELTS activity.
You opened this chat with: "Hey! I'm Sam, your IELTS buddy. How's your day going?" (plus a Vietnamese note that they can use Vietnamese when stuck).
Their estimated Speaking band: ${b}. Things they struggle with: ${profile.weak.join('; ') || 'unknown yet'}. Notes: ${profile.note || 'none'}.
Typical Vietnamese-speaker problems: dropped final consonants and -s/-ed endings, flat intonation and word stress, /θ ð ʃ ʒ/, missing articles and plurals, tense and verb agreement, word-by-word translation, short answers with no extension, overused memorised phrases.

CASUAL CHAT (default, and after [TALK]):
- Always reply in English. Vietnamese is allowed only inside 💡 and ✏️ lines.
- Talk like a real native speaker texting a friend: natural contractions, everyday phrasal verbs and idioms where they fit, but pitched about half a band above theirs so they can follow. 1–3 short sentences, then ONE follow-up question.
- Often steer naturally toward common IELTS Speaking topics (${TOPICS}) and sometimes ask a real Part 1 or Part 3 style question in a casual way — never announce it as a test.
- Whenever their message contains any Vietnamese, first show how a native would say it on a line starting with "💡 " (e.g. "💡 Người bản xứ sẽ nói: I'm wiped out today."), then reply. Never use "💡" for anything else.
- At most ONE line at the end starting with "✏️ ": either fix a mistake that matters, or, if their sentence was correct but sounded textbook, show how a native would say it ("✏️ Tự nhiên hơn: …"), with a few Vietnamese words of why. Skip it when nothing is worth it.

ACTIVITIES (explanations may be in Vietnamese; every English sentence meant to be read aloud goes on its own line starting with "🗣 "; ONE step per reply and wait for the learner; when finished add <done/> and invite them back to chatting):
[SPEAKING] Full mock Speaking test, behave like a real examiner: Part 1 — 4 questions on 1–2 familiar topics, one at a time; Part 2 — give a cue card (topic + 4 bullet prompts), tell them in Vietnamese they have 1 minute to prepare then should talk for 1–2 minutes in ONE message (they may record several times with 🎤 before sending); one short follow-up question; Part 3 — 4 deeper discussion questions linked to Part 2, one at a time. No feedback during the test. At the end: band for each criterion — Fluency & Coherence, Lexical Resource, Grammatical Range & Accuracy, Pronunciation (say Pronunciation is only estimated from the speech-to-text transcript) — and the overall band (IELTS rounding), 3 concrete things to fix, and a native-speaker / band-8 version of two of their answers on 🗣 lines. The SAME reply that gives the scores must end with exactly <band>{"kind":"Speaking","overall":N,"FC":N,"LR":N,"GRA":N,"P":N}</band>, a profile tag, <done/>.
[WRITING] Ask them to paste the task prompt and their essay (Task 1 or Task 2) if they have not. Then mark like an examiner: band for Task Achievement/Response, Coherence & Cohesion, Lexical Resource, Grammatical Range & Accuracy, overall; list the main errors with corrections; rewrite their introduction and one body paragraph at band 8 (plain lines, no 🗣 — writing is not read aloud). The SAME reply that gives the scores must end with exactly <band>{"kind":"Writing","overall":N,"TA":N,"CC":N,"LR":N,"GRA":N}</band>, a profile tag, <done/>.
[LESSON <unit id>] Teach ${u ? `${u.id} "${u.t}" — focus: ${u.d}` : 'the given unit'}. Steps: 1) goal in 1 Vietnamese line + what the examiner rewards here; 2) a short band-8 model answer or key native expressions on 🗣 lines; 3) the technique or grammar point, brief, with the typical Vietnamese mistake; 4) practice: give a real IELTS-style question, they answer, you give a band estimate plus a native upgrade of their answer — do this 2–3 times; 5) quick check: 5 questions one at a time, numbered "Câu 1/5"…"Câu 5/5". Only after the 5th answer: how many were correct, 1 line of feedback, then exactly <score>{"unit":"${u ? u.id : ''}","correct":N,"total":5}</score>, a profile tag, <done/>. Never output a score tag at any other time. Never output a band tag except in the final scoring reply of [SPEAKING] or [WRITING].
[REVIEW] 5 short exercises one at a time on their weak points, each with a native upgrade; then say which improved, profile tag, <done/>.
[TALK] Stop any activity; go back to casual chat naturally.

ALWAYS: plain text, no markdown. When your picture changes, silently append at the very end: <profile>{"band":"N","weak":["..."],"note":"..."}</profile> with the FULL updated profile (band: your estimate of their Speaking band in 0.5 steps, or "" if you have seen fewer than 8 of their messages — change it only after a [SPEAKING] test or clear evidence over many messages; weak: at most 6 short Vietnamese items, only real English problems; note: one short Vietnamese sentence about their progress; always write Vietnamese with full diacritics). Never mention these tags.`;
}

// Tách thẻ <profile>/<score>/<band>/<done/> khỏi lời AI, cập nhật hồ sơ, điểm, kết quả thi thử, chế độ.
function takeTags(text) {
  const bm = text.match(/<band>([\s\S]*?)<\/band>/);
  const exam = mode === 'SPEAKING' || mode === 'WRITING';
  const finished = /<done\s*\/?>/.test(text) || (exam && !!bm); // thẻ band chỉ có ở lượt chấm cuối → coi như xong bài
  const pm = text.match(/<profile>([\s\S]*?)<\/profile>/);
  if (pm) {
    try {
      const p = JSON.parse(pm[1]);
      let nb = toBand(p.band);
      const ob = toBand(profile.band);
      const chats = hist.filter(m => m.role === 'user' && !cmdLabel(m.text)).length;
      if (mode !== 'SPEAKING') {
        if (isNaN(ob) && chats < 8) nb = NaN; // đoán lần đầu từ trò chuyện: cần ≥8 câu
        else if (!isNaN(ob) && !isNaN(nb)) nb = Math.max(ob - 0.5, Math.min(ob + 0.5, nb)); // ngoài thi thử: mỗi lần đổi ≤0.5
      }
      profile = { band: isNaN(nb) ? profile.band : fmt(nb), weak: Array.isArray(p.weak) ? p.weak : profile.weak, note: p.note || profile.note };
      store('ie_profile', profile);
    } catch {}
  }
  if (bm && exam) { // chỉ nhận khi bài thi kết thúc
    try {
      const b = JSON.parse(bm[1]), kind = mode === 'SPEAKING' ? 'Speaking' : 'Writing';
      const crit = {}; for (const c of CRIT[kind]) crit[c] = fmt(toBand(b[c]));
      const overall = toBand(b.overall);
      if (!isNaN(overall)) {
        tests.push({ date: today(), kind, overall: fmt(overall), crit }); store('ie_tests', tests);
        if (kind === 'Speaking') { profile.band = fmt(overall); store('ie_profile', profile); }
      }
    } catch {}
  }
  const sm = text.match(/<score>([\s\S]*?)<\/score>/);
  if (sm && finished && mode === 'LESSON') { // chỉ nhận điểm khi bài học kết thúc
    try {
      const s = JSON.parse(sm[1]);
      const id = unitById(s.unit) ? s.unit : unit;
      const n = Math.max(0, Math.min(10, Math.round(10 * Number(s.correct) / (Number(s.total) || 5))));
      if (unitById(id) && !isNaN(n)) { scores[id] = { score: n, date: today() }; store('ie_scores', scores); }
    } catch {}
  }
  if (finished) setMode('');
  showLevel();
  return text.replace(/<(profile|score|band)>[\s\S]*?(<\/\1>|$)/g, '').replace(/<\/?done\s*\/?>/g, '').trim();
}
// Có dòng 🗣 (lúc học/thi) thì chỉ đọc các dòng đó; nói chuyện thường thì đọc mọi dòng trừ ✏️ 💡.
function spoken(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const say = lines.filter(l => l.startsWith('🗣'));
  return (say.length ? say.map(l => l.replace(/^🗣\s*/, '')) : lines.filter(l => !/^(✏️|💡)/.test(l))).join(' ');
}

function showLevel() { $('#level').textContent = profile.band ? `Band ${profile.band}` : 'chưa rõ'; }

function setMode(m) {
  mode = m; store('ie_mode', mode);
  const label = { SPEAKING: '🎤 Đang thi thử Speaking', WRITING: '✍️ Đang chấm Writing', REVIEW: '🔁 Đang ôn điểm yếu', LESSON: `📚 ${unit}: ${unitById(unit)?.t || ''}` }[mode];
  $('#modebar').hidden = !label;
  if (label) $('#modeText').textContent = label;
  $('#text').classList.toggle('long', mode === 'SPEAKING' || mode === 'WRITING');
}

function cmdLabel(text) {
  const m = text.match(/^\[(SPEAKING|WRITING|TALK|REVIEW|LESSON)(?: (B[5-8]-\d\d))?\]$/);
  if (!m) return null;
  if (m[1] === 'LESSON') return `— Bài ${m[2]}: ${unitById(m[2])?.t || ''} —`;
  return { SPEAKING: '— Thi thử IELTS Speaking —', WRITING: '— Chấm IELTS Writing —', TALK: '— Quay lại nói chuyện —', REVIEW: '— Ôn điểm yếu —' }[m[1]];
}

function render(m) {
  const label = m.role === 'user' && cmdLabel(m.text);
  const div = el('div', label ? 'cmd' : m.role === 'user' ? 'msg me' : 'msg ai');
  if (label || m.role === 'user') div.textContent = label || m.text;
  else {
    for (const line of m.text.split('\n')) {
      const t = line.trim();
      const span = el('span', t.startsWith('🗣') ? 'say' : /^(✏️|💡)/.test(t) ? 'fix' : '', line);
      if (span.className !== 'fix') span.textContent += '\n';
      div.append(span);
    }
    const say = spoken(m.text);
    if (say) {
      const b = el('button', 'play', '🔊'); b.setAttribute('aria-label', 'Nghe lại');
      b.onclick = () => speak(say);
      div.append(b);
    }
  }
  $('#chat').append(div);
  $('#chat').scrollTop = $('#chat').scrollHeight;
  return div;
}

function renderRoad() {
  const road = $('#road'); road.innerHTML = '';
  const done = UNITS.filter(u => scores[u.id]);
  const avg = done.length ? (done.reduce((s, u) => s + scores[u.id].score, 0) / done.length).toFixed(1) : '–';
  const last = k => [...tests].reverse().find(t => t.kind === k);
  const nxt = nextUnit();

  const sum = el('div', 'card');
  sum.append(el('h2', '', 'Band của bạn'));
  const st = el('div', 'stats');
  for (const [v, k] of [[profile.band || '?', 'Nói (ước tính)'], [last('Speaking')?.overall || '–', 'Speaking thi thử'], [last('Writing')?.overall || '–', 'Writing thi thử']]) {
    const d = el('div'); d.append(el('b', '', v), el('span', '', k)); st.append(d);
  }
  sum.append(st);
  if (profile.note) sum.append(el('p', 'hint', profile.note));
  if (profile.weak.length) {
    sum.append(el('p', 'hint', 'Hay mắc:'));
    const ch = el('div', 'chips'); profile.weak.forEach(w => ch.append(el('span', '', w))); sum.append(ch);
  }
  const acts = el('div', 'acts');
  for (const [label, fn, cls] of [['🎤 Thi thử Speaking', () => start('[SPEAKING]'), 'pri'], ['✍️ Chấm Writing', () => start('[WRITING]'), 'pri'],
                                  ['📚 Bài tiếp theo', () => startLesson(nxt.id)], ['🔁 Ôn điểm yếu', () => start('[REVIEW]')]]) {
    const b = el('button', cls || '', label); b.onclick = fn; acts.append(b);
  }
  sum.append(acts);
  sum.append(el('p', 'hint', `Bài đã học: ${done.length}/${UNITS.length} · điểm TB ${avg}/10. Mỗi ngày: nói chuyện với Sam 10–15 phút + học 📚 một phần bài. Mỗi 2 tuần 🎤 thi thử một lần để xem band lên chưa. Phát âm chỉ được ước lượng qua chữ nhận dạng giọng nói.`));
  road.append(sum);

  if (tests.length) {
    const h = el('div', 'card'); h.append(el('h2', '', 'Lịch sử thi thử'));
    for (const t of [...tests].reverse().slice(0, 8))
      h.append(el('p', 'hist', `${t.date} · ${t.kind} ${t.overall} (${Object.entries(t.crit).map(([k, v]) => `${k} ${v || '?'}`).join(' · ')})`));
    road.append(h);
  }

  for (const sk of Object.keys(STAGES)) {
    const us = UNITS.filter(u => u.st === sk);
    const n = us.filter(u => scores[u.id]).length;
    const c = el('div', 'card');
    c.append(el('h2', '', `Chặng band ${sk} · ${n}/${us.length} bài`), el('div', 'hint', STAGES[sk]));
    const bar = el('div', 'bar'); const fill = el('i'); fill.style.width = (n / us.length * 100) + '%'; bar.append(fill); c.append(bar);
    for (const u of us) {
      const row = el('div', 'unit' + (u === nxt ? ' next' : ''));
      const t = el('div', 't'); t.append(el('b', '', `${u.id.slice(3)}. ${u.t}`), el('small', '', u.d));
      row.append(t);
      if (scores[u.id]) row.append(el('span', 's', `${scores[u.id].score}/10`));
      const b = el('button', '', scores[u.id] ? 'Học lại' : u === nxt ? 'Học' : 'Mở');
      b.onclick = () => startLesson(u.id);
      row.append(b);
      c.append(row);
    }
    road.append(c);
  }
}

function show(view) {
  document.querySelectorAll('.view').forEach(v => v.hidden = v.id !== view);
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  if (view === 'vRoad') renderRoad();
}

function speak(t) {
  if (!t || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = 'en-US'; u.rate = 0.95;
  const vs = speechSynthesis.getVoices(), lang = v => v.lang.replace('_', '-'); // Chrome Android ghi en_US
  const v = vs.find(v => lang(v) === 'en-US') || vs.find(v => lang(v).startsWith('en'));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

// Gọi AI. Tách riêng để có thể thay nguồn AI khác.
async function askAI(onWait) {
  const body = JSON.stringify({
    system_instruction: { parts: [{ text: systemPrompt() }] },
    contents: hist.slice(-MAX_HIST).map(m => ({ role: m.role, parts: [{ text: m.text }] })),
  });
  let r, data;
  // Gói free hay bị 503 "quá tải" hoặc rớt mạng chốc lát: tự gọi lại tối đa 4 lần, chờ 2-4-8s.
  for (let i = 0; i < 5; i++) {
    try {
      r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key }, body,
      });
      data = await r.json();
    } catch { r = { status: 0, ok: false }; data = {}; }
    if (![0, 500, 503].includes(r.status)) break;
    onWait(`… Sam đang bận chút, thử lại ${i + 1}/4`);
    if (i < 4) await new Promise(ok => setTimeout(ok, 2000 * 2 ** Math.min(i, 2)));
  }
  if (r.status === 503 || r.status === 500) throw new Error('Google đang quá tải, bấm gửi lại sau ít phút.');
  if (r.status === 0) throw new Error('Mất mạng. Kiểm tra wifi/4G rồi gửi lại.');
  if (!r.ok) throw new Error(data.error?.message || r.status);
  const raw = (data.candidates?.[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('');
  if (!raw) throw new Error('Sam không trả lời được câu này. Thử nói cách khác nhé.');
  return raw;
}

let busy = false;
async function send(text) {
  text = text.trim();
  if (!text || busy) return;
  if (!key) { $('#set').showModal(); return; }
  const cmd = text.match(/^\[(SPEAKING|WRITING|TALK|REVIEW|LESSON)/);
  if (cmd) setMode(cmd[1] === 'TALK' ? '' : cmd[1]);
  const wasWriting = mode === 'WRITING';
  busy = true;
  hist.push({ role: 'user', text });
  render(hist.at(-1));
  const wait = render({ role: 'model', text: '…' });
  try {
    const shown = takeTags(await askAI(t => wait.textContent = t));
    hist.push({ role: 'model', text: shown });
    store('ie_hist', hist.slice(-MAX_HIST));
    wait.remove();
    render(hist.at(-1));
    if (!wasWriting) speak(spoken(shown)); // Writing: không đọc to bài văn
  } catch (e) {
    hist.pop(); // bỏ câu chưa được trả lời để lịch sử vẫn xen kẽ user/model
    wait.className = 'cmd';
    wait.textContent = '⚠️ ' + (/quota|429/i.test(e.message) ? 'Hết lượt free hôm nay hoặc gửi quá nhanh, chờ một lát.' : e.message);
  } finally { busy = false; }
}

function start(cmd) { show('vChat'); send(cmd); }
function startLesson(id) { unit = id; store('ie_unit', unit); start(`[LESSON ${id}]`); }

// Nhận giọng nói. Nói chuyện thường: nói xong tự gửi. Lúc thi Speaking/Writing: chữ nối vào ô nhập,
// nói nhiều lần được (Part 2 dài 1–2 phút), xong bấm ➤ mới gửi.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  const rec = new SR();
  rec.lang = 'en-US'; rec.interimResults = false;
  rec.onresult = e => {
    const said = e.results[0][0].transcript;
    if (mode === 'SPEAKING' || mode === 'WRITING') { const t = $('#text'); t.value = (t.value ? t.value + ' ' : '') + said; }
    else send(said);
  };
  rec.onend = () => $('#mic').classList.remove('on');
  rec.onerror = e => { if (e.error !== 'no-speech' && e.error !== 'aborted') render({ role: 'model', text: '⚠️ mic: ' + e.error }); };
  $('#mic').onclick = () => {
    if ($('#mic').classList.contains('on')) return rec.stop();
    speechSynthesis?.cancel();
    $('#mic').classList.add('on'); rec.start();
  };
} else $('#mic').hidden = true;

$('#send').onclick = () => { send($('#text').value); $('#text').value = ''; };
$('#text').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && mode !== 'WRITING') { e.preventDefault(); $('#send').click(); } };
$('#stop').onclick = () => send('[TALK]');
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.view));
$('#level').onclick = () => show('vRoad');

$('#openSet').onclick = () => { $('#key').value = key; $('#model').value = model; $('#set').showModal(); };
$('#save').onclick = () => {
  key = $('#key').value.trim(); model = $('#model').value.trim() || DEFAULT_MODEL;
  store('gs_key', key); store('gs_model', model); $('#set').close();
};
$('#reset').onclick = () => {
  if (!confirm('Xoá toàn bộ trò chuyện, band, điểm và lịch sử thi thử?')) return;
  profile = { band: '', weak: [], note: '' }; hist = []; scores = {}; tests = []; unit = '';
  for (const k of Object.keys(localStorage)) if (/^(ie_|gs_(?!key|model))/.test(k)) try { localStorage.removeItem(k); } catch {}
  $('#chat').innerHTML = ''; setMode(''); showLevel(); greet(); $('#set').close();
};

function greet() { render({ role: 'model', text: "Hey! I'm Sam, your IELTS buddy.\nHow's your day going?\n💡 Cứ nói thoải mái như với bạn bè, bí chữ thì nói tiếng Việt, mình chỉ cách người bản xứ nói. Thi thử Speaking, chấm Writing và lộ trình band ở tab 🎯 IELTS." }); }

showLevel();
setMode(mode);
if (hist.length) hist.forEach(render); else greet();
if (!key) $('#set').showModal();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
